name: Build Horizon Launcher (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --manifest-path launcher/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-Windows-x64
          path: launcher/target/release/horizon-launcher.exe
          if-no-files-found: error
          retention-days: 7
